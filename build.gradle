plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'launcher'
version = '1.0.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.media']
}

application {
    mainClass = 'launcher.LauncherMain'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'net.java.dev.jna:jna:5.13.0'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    systemProperty 'file.encoding', 'UTF-8'
}

run {
    jvmArgs = ['-Dfile.encoding=UTF-8']
}

shadowJar {
    archiveBaseName.set('worm-launcher')
    archiveClassifier.set('')
    archiveVersion.set('1.0.3')

    mergeServiceFiles()

    // без этого shadow падает на module-info от javafx и jna
    exclude 'module-info.class'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    manifest {
        attributes 'Main-Class': 'launcher.LauncherMain'
    }
}

build.dependsOn shadowJar